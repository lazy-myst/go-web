# Air configuration for Go (Fiber backend) and React frontend project

[build]
  cmd = "go build -o ./tmp/backend ./backend"  # Builds the Go backend into the tmp folder
  bin = "./tmp/backend"                        # Specifies the Go binary location
  delay = 200                                  # Delay in milliseconds before rebuilding
  include_dir = ["backend"]                    # Only watch the backend directory for Go changes
  exclude_dir = ["frontend", "tmp", "vendor", "node_modules", ".git"]  # Exclude non-Go folders
  exclude_file = ["*.tmp", "*.log"]            # Exclude temporary and log files

[log]
  output = "stdout"                            # Logs are sent to stdout
  level = "debug"                              # Log level (debug, info, warn, error)

[watch]
  extensions = ["go", "html", "json"]          # Watch changes in Go, HTML, and JSON files
  include_dir = ["backend"]                    # Monitor backend folder for changes
  full_reload_exts = ["env"]                   # Fully reload on changes to .env files

[live]
  reload_on_change = true                      # Enable live reloading for the backend
  hot_reloading = false                        # No hot reloading (as it's for backend)

[misc]
  colored_logs = true                          # Colorful logs
  working_dir = "."                            # Set working directory to the root of the project

[frontend]
  cmd = "npm start --prefix frontend"          # Command to start React frontend
  delay = 200                                  # Delay before restarting frontend
  include_dir = ["frontend/src"]               # Watch the React source folder
  extensions = ["js", "jsx", "ts", "tsx", "css", "scss", "html"]  # Watch React-specific files
  exclude_dir = ["node_modules", "frontend/build"]  # Ignore large or output folders
