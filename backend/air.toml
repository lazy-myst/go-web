# Air configuration for Go (Fiber backend) with live-reloading during development

# Build settings
[build]
  cmd = "go build -o ./tmp/backend ./cmd/server/main.go"   # Path to your Go application's entry point
  bin = "./tmp/backend"                                     # Path to store the compiled binary
  delay = 200                                                # Delay in milliseconds before rebuilding
  include_dir = ["backend", "cmd", "internal", "pkg", "scripts", "config"]  # Watch these backend directories for changes
  exclude_dir = ["frontend", "backend/tmp", "vendor", "node_modules", ".git"]  # Exclude unnecessary directories like frontend, temp files, etc.
  exclude_file = ["*.tmp", "*.log"]                          # Exclude temporary and log files

# Log settings
[log]
  output = "stdout"                                         # Logs to stdout
  level = "debug"                                           # Log level (debug for development)

# Watch settings
[watch]
  extensions = ["go", "html", "json"]                       # Watch Go files, HTML, and JSON files for changes
  include_dir = ["backend", "cmd", "internal", "pkg", "scripts", "config"]  # Only monitor the backend directories for changes
  exclude_dir = ["frontend", "backend/tmp", "node_modules", "backend/bin"]  # Exclude unnecessary directories
  full_reload_exts = ["env"]                                # Fully reload when .env changes

# Live reloading settings
[live]
  reload_on_change = true                                   # Enable live reloading for the backend
  hot_reloading = false                                      # Enable hot-reloading (Air will reload without restarting the entire process)

# Miscellaneous settings
[misc]
  colored_logs = true                                       # Enable colored logs for better readability
  working_dir = "."                                         # Working directory for the app (root of the project)
