# Reverse proxy for the chat backend. No domain yet, so this listens on
# plain HTTP on the port you choose below (80 by default — change LISTEN_PORT
# if you'd rather use something else, e.g. because 80 is taken).
#
# Install: sudo cp nginx-chatapp.conf /etc/nginx/sites-available/chatapp
#          sudo ln -s /etc/nginx/sites-available/chatapp /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Required for the gRPC-Web streaming call (StreamMessages).
        # Without these, nginx buffers the whole response before forwarding
        # it, which turns "real-time" into "arrives whenever the buffer
        # flushes" (or never, since the stream never ends on its own).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Let each request pick its own Connection header instead of nginx
        # forcing one — matters for the long-lived streaming call.
        proxy_set_header Connection "";
    }
}
