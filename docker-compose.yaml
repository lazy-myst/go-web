

services:
  backend:
    container_name: Backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    container_name: Frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Ensure node_modules are not overwritten
    networks:
      - app-network
    environment:
      - VITE_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true  # Enable polling to detect file changes
      - WATCHPACK_POLLING=true
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
